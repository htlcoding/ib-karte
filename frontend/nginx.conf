server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # API an das C#-Backend weiterreichen
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gebaute Dateien tragen einen Hash im Namen und dürfen lange zwischengespeichert werden.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /laender.geojson {
        types { application/geo+json geojson; }
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri /index.html;
    }
}
