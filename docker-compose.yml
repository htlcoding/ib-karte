# Lokaler Betrieb: Postgres, C#-API und Vue-Frontend (nginx).
# Start:   docker compose up -d --build
# Import:  docker compose run --rm api import
# Karte:   http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ibkarte
      POSTGRES_USER: ibkarte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibkarte}
    volumes:
      - pgdaten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibkarte -d ibkarte"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Karte: Host=db;Port=5432;Database=ibkarte;Username=ibkarte;Password=${POSTGRES_PASSWORD:-ibkarte};GSS Encryption Mode=Disable
      Import__Schluessel: ${IMPORT_SCHLUESSEL:-}
    volumes:
      - ./daten:/daten:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdaten:
